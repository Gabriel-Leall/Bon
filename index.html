<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bon/bon-approved.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bon</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('ui-theme')
        const theme =
          storedTheme === 'cream'
            ? 'cream'
            : storedTheme === 'dark' || storedTheme === 'entardecer'
              ? 'dark'
              : storedTheme === 'light'
                ? 'light'
                : matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
        document.documentElement.classList.add(theme)
      } catch {
        document.documentElement.classList.add('light')
      }
    </script>
    <style>
      :root {
        --boot-background: oklch(0.96 0.003 247.9);
        --boot-foreground: oklch(0.176 0.005 248.1);
        background: var(--boot-background);
      }

      :root.dark {
        --boot-background: oklch(0.15 0 0);
        --boot-foreground: oklch(0.95 0 0);
      }

      :root.cream {
        --boot-background: oklch(0.985 0.014 88);
        --boot-foreground: oklch(0.18 0.005 60);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--boot-background);
      }

      .bon-boot {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--boot-background);
        color: var(--boot-foreground);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .bon-boot__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        transform: translateY(-1.25rem);
      }

      .bon-boot__mark {
        display: block;
        width: 12rem;
        height: 12rem;
        object-fit: contain;
      }

      .bon-boot__name {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="bon-boot" aria-label="Bon">
        <div class="bon-boot__stack">
          <img class="bon-boot__mark" src="/bon/bon-approved.png" alt="Bon" />
          <p class="bon-boot__name">Bon</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
